<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fair Value Overlay</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <div class="brand"><span>ƒ</span><div><strong>Fair Value Overlay</strong><small>Robinhood option chains</small></div></div>
      <label class="enabled"><span>Show overlays</span><input id="enabled" type="checkbox"></label>
      <label>IV source
        <select id="ivSource">
          <option value="manual">Manual IV</option>
          <option value="selected">Selected-row IV</option>
        </select>
      </label>
      <div class="grid">
        <label>Volatility %<input id="volatility" type="number" min="0.01" max="500" step="0.1"></label>
        <label>Risk-free %<input id="rate" type="number" min="-20" max="100" step="0.05"></label>
      </div>
      <label class="enabled compact"><span>Use ticker dividend default</span><input id="autoDividend" type="checkbox"></label>
      <label>Dividend yield %<input id="dividend" type="number" min="0" max="100" step="0.05"></label>
      <button id="apply" type="button">Apply to Robinhood</button>
      <p id="message" role="status">Calculations stay on your device.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
