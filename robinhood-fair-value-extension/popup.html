<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fair Value Overlay</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <div class="brand"><span>ƒ</span><div><strong>Fair Value Overlay</strong><small>Robinhood option chains</small></div></div>
      <label class="enabled"><span>Show overlays</span><input id="enabled" type="checkbox"></label>
      <label>IV source
        <select id="ivSource">
          <option value="walkforward">Walk-forward forecast JSON</option>
          <option value="surface">Smoothed market smile</option>
          <option value="forecast">Own forecast + market skew</option>
          <option value="individual">Individual market IV</option>
          <option value="manual">Flat own-vol forecast</option>
        </select>
      </label>
      <label>Strike-skew transform
        <select id="surfaceShiftMethod">
          <option value="total_variance_shift">Total-variance shift</option>
          <option value="variance_shift">Annualized-variance shift</option>
          <option value="multiplicative_iv">Multiplicative IV ratio</option>
          <option value="additive_iv">Additive IV shift</option>
        </select>
      </label>
      <section class="forecast-import">
        <strong>Walk-forward forecast bridge</strong>
        <label>Import latest_forecasts.json<input id="forecastFile" type="file" accept="application/json,.json"></label>
        <p id="forecastStatus">No forecast file imported.</p>
      </section>
      <div class="grid">
        <label>Forecast ATM IV %<input id="volatility" type="number" min="0.01" max="500" step="0.1"></label>
        <label>Fair-IV shift pt<input id="ivShift" type="number" min="-100" max="100" step="0.1"></label>
      </div>
      <label class="enabled compact"><span>Auto Treasury rate curve</span><input id="autoRate" type="checkbox"></label>
      <label>Manual risk-free rate %<input id="rate" type="number" min="-20" max="100" step="0.05"></label>
      <label class="enabled compact"><span>Auto ticker dividends</span><input id="autoDividend" type="checkbox"></label>
      <label>Manual dividend yield %<input id="dividend" type="number" min="0" max="100" step="0.05"></label>
      <label class="enabled compact"><span>Highlight research flags</span><input id="alertsEnabled" type="checkbox"></label>
      <label class="enabled compact"><span>Rank SPY strategy candidates</span><input id="strategyEnabled" type="checkbox"></label>
      <div class="grid">
        <label>Minimum edge %<input id="gapThreshold" type="number" min="1" max="100" step="1"></label>
        <label>Maximum spread %<input id="maxSpreadPercent" type="number" min="1" max="100" step="1"></label>
      </div>
      <label class="enabled compact"><span>Continuous Mark/IV refresh</span><input id="autoScan" type="checkbox"></label>
      <label>Refresh interval seconds<input id="autoScanIntervalSeconds" type="number" min="15" max="300" step="5"></label>
      <label class="enabled compact"><span>Record paper outcomes locally</span><input id="paperRecording" type="checkbox"></label>
      <div class="grid">
        <label>American tree max steps<input id="treeSteps" type="number" min="100" max="800" step="100"></label>
        <label>Tree tolerance $<input id="treeTolerance" type="number" min="0.0001" max="0.1" step="0.0001"></label>
      </div>
      <button id="apply" type="button">Apply to Robinhood</button>
      <div class="grid">
        <button id="exportPaper" class="secondary" type="button">Export paper data</button>
        <button id="clearPaper" class="secondary" type="button">Clear paper data</button>
      </div>
      <p id="paperStatus" role="status">No paper observations yet.</p>
      <p id="message" role="status">Calculations stay on your device.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
